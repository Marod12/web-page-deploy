apiVersion: batch/v1
kind: Job
metadata:
  generateName: pre-sync-
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  template:
    spec:
      containers:
        - name: chamada
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - | 
              curl -X POST -H "Content-Type: application/json" \
              -d '{"message": "Entrou em Pre Sync !!"}' \
              https://purple-griffin-14.webhook.cool
      restartPolicy: Never

---

apiVersion: batch/v1
