apiVersion: batch/v1
kind: Job
metadata:
  name: pre-sync
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
        - name: chamada
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - | 
              curl -X POST -H "Content-Type: application/json" \
              -d '{"message": "Entrou em Pre Sync !!"}' \
              https://webhook.marod.dev/api/4bwISswemTaVzxGOakkA/capture/argocd/pre-sync/homolog
      restartPolicy: Never

---

